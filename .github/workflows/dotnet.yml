name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.300
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    # tests/TerminalHost.UITests is deliberately excluded: FlaUI launches host.exe
    # and needs an interactive desktop session, which hosted runners don't provide.
    - name: Test (Core)
      run: dotnet test tests/TerminalHost.Tests --no-build --verbosity normal
    - name: Test (Avalonia)
      run: dotnet test tests/TerminalHost.Avalonia.Tests --no-build --verbosity normal
